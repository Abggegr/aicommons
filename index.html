<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6d1526">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI需求情景卡">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/app-icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/app-icon-180.png">
  <title>AI需求情景卡</title>
  <style>
    :root {
      --paper: #fbf8f2;
      --surface: #fffdf9;
      --ink: #181313;
      --muted: #6d6862;
      --burgundy: #6d1526;
      --burgundy-dark: #52101d;
      --wine-soft: #f7ecee;
      --gold: #b68b43;
      --sand: #eadcc6;
      --line: #e4d8c6;
      --line-strong: #c9b99e;
      --success: #2f624d;
      --danger: #9b2f2f;
      --shadow: 0 18px 50px rgba(68, 45, 25, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    button:focus-visible,
    textarea:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(182, 139, 67, 0.58);
      outline-offset: 3px;
    }

    h2[tabindex="-1"]:focus { outline: none; }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 8px;
      left: 8px;
      padding: 10px 14px;
      color: #fff;
      background: var(--burgundy);
      border-radius: 8px;
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    #app { min-height: 100vh; }

    .topbar {
      position: sticky;
      z-index: 20;
      top: 0;
      padding: max(14px, env(safe-area-inset-top)) 18px 13px;
      background: rgba(251, 248, 242, 0.96);
      border-bottom: 1px solid rgba(201, 185, 158, 0.72);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(100%, 860px);
      margin: 0 auto;
    }

    .brand-row,
    .progress-row,
    .action-row,
    .result-actions,
    .rank-summary,
    .scenario-picks {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-row { justify-content: space-between; }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      display: block;
      margin-bottom: 2px;
      color: var(--burgundy);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(1.05rem, 3.8vw, 1.32rem);
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    .mode-badge {
      display: none;
      width: max-content;
      margin-top: 5px;
      padding: 2px 8px;
      color: var(--burgundy);
      background: var(--wine-soft);
      border: 1px solid #e5c8ce;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    body.facilitator .mode-badge { display: inline-flex; }

    .utility-row {
      display: flex;
      flex-shrink: 0;
      gap: 4px;
    }

    .icon-button {
      min-width: 42px;
      min-height: 42px;
      padding: 8px;
      color: var(--burgundy);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
    }

    .icon-button:hover { background: var(--wine-soft); }

    .icon-button img { width: 23px; height: 23px; display: block; margin: auto; }

    .progress-row { margin-top: 12px; }

    .progress-track {
      position: relative;
      flex: 1;
      height: 5px;
      overflow: hidden;
      background: var(--sand);
      border-radius: 999px;
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      background: var(--burgundy);
      border-radius: inherit;
      transition: width 180ms ease;
    }

    .progress-text {
      min-width: 48px;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .offline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    .offline-status {
      display: inline-flex;
      flex: 1 1 auto;
      align-items: center;
      min-width: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .offline-status-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(182, 139, 67, 0.14);
    }

    .offline-status[data-state="ready"] { color: var(--success); }
    .offline-status[data-state="ready"] .offline-status-dot {
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(47, 98, 77, 0.14);
    }

    .offline-status[data-state="warning"] { color: var(--danger); }
    .offline-status[data-state="warning"] .offline-status-dot {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(155, 47, 47, 0.12);
    }

    .offline-check-button {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 5px 10px;
      color: var(--burgundy);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
    }

    .offline-check-button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    main {
      width: min(calc(100% - 28px), 860px);
      margin: 0 auto;
      padding: 26px 0 118px;
    }

    .question-card,
    .result-page {
      animation: card-in 180ms ease-out;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .question-head {
      max-width: 680px;
      margin-bottom: 20px;
    }

    .question-number {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--burgundy);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .question-number::before {
      width: 22px;
      height: 2px;
      content: "";
      background: var(--gold);
    }

    h2 {
      max-width: 760px;
      margin: 9px 0 8px;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(1.6rem, 6vw, 2.35rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .question-help,
    .section-note,
    .result-disclaimer {
      margin: 0;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option {
      position: relative;
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      width: 100%;
      min-height: 86px;
      padding: 14px 15px;
      color: var(--ink);
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 4px 16px rgba(68, 45, 25, 0.035);
      cursor: pointer;
    }

    .option:hover {
      border-color: var(--line-strong);
      box-shadow: 0 7px 20px rgba(68, 45, 25, 0.07);
    }

    .option[aria-pressed="true"] {
      background: #fff9f7;
      border-color: var(--burgundy);
      box-shadow: inset 4px 0 0 var(--burgundy);
    }

    .option-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .option-copy { min-width: 0; }

    .option-title {
      display: block;
      font-weight: 800;
      line-height: 1.35;
    }

    .option-desc {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .option-mark {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      margin-left: 9px;
      color: transparent;
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .option[aria-pressed="true"] .option-mark {
      color: #fff;
      background: var(--burgundy);
      border-color: var(--burgundy);
    }

    .option.sensitive::after {
      position: absolute;
      top: 8px;
      right: 9px;
      padding: 1px 6px;
      color: #744c16;
      background: #f7ecd6;
      border-radius: 999px;
      content: "需确认授权";
      font-size: 0.65rem;
      font-weight: 700;
    }

    .rank-summary,
    .scenario-picks {
      flex-wrap: wrap;
      margin: 0 0 14px;
    }

    .rank-chip,
    .pick-chip {
      padding: 7px 10px;
      color: var(--burgundy);
      background: var(--wine-soft);
      border: 1px solid #e5c8ce;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .rank-chip.empty,
    .pick-chip.empty {
      color: var(--muted);
      background: transparent;
      border-color: var(--line);
      font-weight: 500;
    }

    .rank-number {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #fff;
      background: var(--burgundy);
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .option:not([aria-pressed="true"]) .rank-number {
      color: var(--muted);
      background: #f0ebe3;
    }

    .scenario-shell {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .scenario-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 12px 12px 6px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scenario-tabs::-webkit-scrollbar { width: 0; height: 0; display: none; }

    .scenario-tab {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 8px 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .scenario-tab[aria-selected="true"] {
      color: var(--burgundy);
      background: var(--wine-soft);
      border-color: #e4cbd0;
      font-weight: 800;
    }

    .scenario-tab-short { display: none; }

    .scenario-visual {
      display: grid;
      min-height: 238px;
      place-items: center;
      padding: 8px 14px 2px;
      background: #f8f0e5;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .scenario-visual img {
      width: 100%;
      height: 232px;
      object-fit: contain;
    }

    .scenario-empty {
      display: grid;
      width: 120px;
      height: 120px;
      place-items: center;
      color: var(--burgundy);
      background: #fffaf5;
      border: 1px solid var(--sand);
      border-radius: 50%;
      font-size: 2.6rem;
      font-family: Georgia, serif;
    }

    .scenario-body { padding: 20px; }

    .scenario-step {
      display: inline-flex;
      padding: 4px 9px;
      color: var(--burgundy);
      background: var(--wine-soft);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .scenario-body h3 {
      margin: 10px 0 6px;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: 1.45rem;
      line-height: 1.3;
    }

    .scenario-body p { margin: 0; color: var(--muted); }

    .scenario-details {
      display: grid;
      gap: 7px;
      margin: 15px 0 0;
      padding: 0;
      list-style: none;
    }

    .scenario-details li {
      position: relative;
      padding-left: 18px;
      font-size: 0.88rem;
    }

    .scenario-details li::before {
      position: absolute;
      top: 0.7em;
      left: 2px;
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
      content: "";
      transform: translateY(-50%);
    }

    .scenario-controls {
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      gap: 8px;
      padding: 0 20px 20px;
    }

    .scenario-arrow,
    .scenario-choose,
    .primary-button,
    .secondary-button,
    .text-button,
    .export-button {
      min-height: 48px;
      border-radius: 12px;
      cursor: pointer;
    }

    .scenario-arrow {
      color: var(--burgundy);
      background: #fff;
      border: 1px solid var(--line);
      font-size: 1.2rem;
    }

    .scenario-choose {
      padding: 10px 14px;
      color: #fff;
      background: var(--burgundy);
      border: 1px solid var(--burgundy);
      font-weight: 800;
    }

    .scenario-choose:disabled {
      color: var(--muted);
      background: #eee8df;
      border-color: #eee8df;
      cursor: not-allowed;
    }

    .restart-priority {
      margin: 12px 0 0;
      padding: 0;
      color: var(--burgundy);
      background: transparent;
      border: 0;
      font-size: 0.82rem;
      text-decoration: underline;
      cursor: pointer;
    }

    .phase-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin: 2px 0 16px;
      padding: 10px 6px;
      color: var(--muted);
      background: #f7f0e6;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 0.74rem;
      text-align: center;
    }

    .phase-strip span {
      position: relative;
    }

    .phase-strip span:not(:last-child)::after {
      position: absolute;
      top: 50%;
      right: -9px;
      width: 18px;
      height: 1px;
      background: var(--line-strong);
      content: "";
    }

    .memory-block {
      margin-top: 20px;
      padding-top: 19px;
      border-top: 1px solid var(--line);
    }

    .memory-block h3 {
      margin: 0 0 5px;
      font-size: 1rem;
    }

    .memory-block p { margin: 0 0 12px; color: var(--muted); font-size: 0.84rem; }

    .note-field {
      margin-top: 18px;
    }

    .note-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .note-field textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      padding: 11px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
    }

    .safety-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 14px;
      padding: 11px 12px;
      color: #674717;
      background: #faf1df;
      border-left: 3px solid var(--gold);
      border-radius: 4px 10px 10px 4px;
      font-size: 0.8rem;
    }

    .safety-note img { width: 20px; height: 20px; flex: 0 0 auto; }

    .facilitator-panel {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #f2eee8;
      border: 1px dashed #aa9071;
      border-radius: 14px;
    }

    body.facilitator .facilitator-panel { display: block; }

    .facilitator-panel summary {
      color: var(--burgundy);
      font-weight: 800;
      cursor: pointer;
    }

    .facilitator-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .facilitator-item strong {
      display: block;
      margin-bottom: 2px;
      font-size: 0.76rem;
      text-transform: uppercase;
    }

    .facilitator-item span { color: #514a43; font-size: 0.82rem; }

    .validation {
      min-height: 22px;
      margin: 14px 0 0;
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .action-bar {
      position: fixed;
      z-index: 15;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      background: rgba(251, 248, 242, 0.97);
      border-top: 1px solid rgba(201, 185, 158, 0.75);
      backdrop-filter: blur(14px);
    }

    .action-row {
      width: min(100%, 860px);
      margin: 0 auto;
    }

    .primary-button,
    .secondary-button {
      padding: 11px 17px;
      font-weight: 800;
    }

    .primary-button {
      flex: 1;
      color: #fff;
      background: var(--burgundy);
      border: 1px solid var(--burgundy);
    }

    .primary-button:hover { background: var(--burgundy-dark); }

    .secondary-button {
      min-width: 92px;
      color: var(--burgundy);
      background: transparent;
      border: 1px solid var(--line-strong);
    }

    .secondary-button:disabled { opacity: 0.4; cursor: not-allowed; }

    .site-footer {
      width: min(calc(100% - 28px), 860px);
      margin: -84px auto 0;
      padding-bottom: 96px;
      color: var(--muted);
      font-size: 0.72rem;
      text-align: center;
    }

    .result-page { max-width: 760px; margin: 0 auto; }

    .result-lead {
      margin-bottom: 20px;
      padding: 22px;
      color: #fff;
      background: var(--burgundy);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .result-lead .eyebrow { color: #e8c98e; }

    .result-lead h2 { margin-top: 8px; color: #fff; }

    .result-lead p { margin: 8px 0 0; color: #f1dfe2; }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .result-card {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 15px;
    }

    .result-card.wide { grid-column: 1 / -1; }

    .result-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .result-value {
      margin: 0;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: 1.18rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .result-detail { margin: 6px 0 0; color: var(--muted); font-size: 0.84rem; }

    .followups { margin: 8px 0 0; padding-left: 1.2em; }

    .followups li { margin: 7px 0; }

    .hypothesis-box {
      margin-top: 13px;
      padding: 15px;
      background: #f8f1e5;
      border-left: 3px solid var(--gold);
      border-radius: 4px 12px 12px 4px;
    }

    .result-disclaimer {
      margin-top: 16px;
      padding: 12px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .result-actions {
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .export-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 138px;
      padding: 10px 13px;
      color: var(--burgundy);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .export-button.primary {
      color: #fff;
      background: var(--burgundy);
      border-color: var(--burgundy);
    }

    .export-button img { width: 20px; height: 20px; }
    .export-button.primary img { filter: brightness(0) invert(1); }

    .result-back {
      margin-top: 16px;
      padding: 0;
      color: var(--burgundy);
      background: transparent;
      border: 0;
      text-decoration: underline;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      z-index: 50;
      bottom: calc(84px + env(safe-area-inset-bottom));
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 10px 14px;
      color: #fff;
      background: #292321;
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition: 150ms ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    #printSheet { display: none; }

    @media (min-width: 700px) {
      .topbar { padding-right: 28px; padding-left: 28px; }
      main { padding-top: 40px; }
      .option-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .option-grid.single-column { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .scenario-shell { display: grid; grid-template-columns: 46% 54%; }
      .scenario-tabs { grid-column: 1 / -1; }
      .scenario-visual { min-height: 390px; border-bottom: 0; border-right: 1px solid var(--line); }
      .scenario-visual img { height: 340px; }
      .scenario-content { display: flex; flex-direction: column; }

    const blankState = () => ({
      version: 1,
      screen: 0,
      scenarioView: 0,
      answers: {},
      notes: {},
      updatedAt: ""
    });

    let state = loadState();
    let validationMessage = "";
    let toastTimer = 0;

    if (facilitatorMode) document.body.classList.add("facilitator");

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return blankState();
        const saved = JSON.parse(raw);
        if (!saved || saved.version !== 1) return blankState();
        return {
          ...blankState(),
          ...saved,
          screen: Math.max(0, Math.min(questions.length, Number(saved.screen) || 0)),
          scenarioView: Math.max(0, Math.min(5, Number(saved.scenarioView) || 0)),
          answers: saved.answers && typeof saved.answers === "object" ? saved.answers : {},
          notes: saved.notes && typeof saved.notes === "object" ? saved.notes : {}
        };
      } catch (_error) {
        return blankState();
      }
    }

    function saveState() {
      state.updatedAt = new Date().toISOString();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_error) {
        showToast("浏览器未能保存进度，请保持本页打开");
      }
    }

    function setOfflineStatus(status, message) {
      const statusNode = document.getElementById("offlineStatus");
      const textNode = document.getElementById("offlineStatusText");
      if (!statusNode || !textNode) return;
      statusNode.dataset.state = status;
      textNode.textContent = message;
    }

    function verifyLocalStorage() {
      const key = STORAGE_KEY + ".offlineCheck";
      const marker = String(Date.now());
      try {
        localStorage.setItem(key, marker);
        const verified = localStorage.getItem(key) === marker;
        localStorage.removeItem(key);
        return verified;
      } catch (_error) {
        return false;
      }
    }

    async function requestPersistentStorage() {
      try {
        if (!navigator.storage?.persisted) return false;
        return await navigator.storage.persisted()
          || Boolean(await navigator.storage.persist?.());
      } catch (_error) {
        return false;
      }
    }

    function refreshOfflineStatus() {
      if (!offlineReady) return;
      if (!navigator.onLine) {
        setOfflineStatus("ready", "当前离线 · 本地内容可用");
      } else if (persistentStorage) {
        setOfflineStatus("ready", "离线已就绪 · 持久存储已启用");
      } else {
        setOfflineStatus("ready", "离线已就绪 · 已缓存至本机");
      }
    }

    async function checkOfflineReadiness({ interactive = false } = {}) {
      const button = document.getElementById("offlineCheckButton");
      if (button) button.disabled = true;
      setOfflineStatus("checking", "正在检查离线内容…");

      try {
        if (!window.isSecureContext || !("serviceWorker" in navigator) || !("caches" in window)) {
          throw new Error("当前打开方式不支持离线安装");
        }

        const registration = await Promise.race([
          navigator.serviceWorker.ready,
          new Promise((_, reject) => {
            window.setTimeout(() => reject(new Error("离线缓存初始化超时")), 10000);
          })
        ]);
        if (!registration.active) throw new Error("离线服务尚未激活");

        const cachedAssets = await Promise.all(
          OFFLINE_ASSETS.map((asset) => caches.match(new URL(asset, location.href).href, { ignoreSearch: true }))
        );
        const missingAssets = OFFLINE_ASSETS.filter((_, index) => !cachedAssets[index]);
        if (missingAssets.length) throw new Error("仍有离线文件未缓存，请保持联网后重试");
        if (!verifyLocalStorage()) throw new Error("本机保存不可用，请检查 Safari 设置");

        persistentStorage = await requestPersistentStorage();
        offlineReady = true;
        if (!navigator.serviceWorker.controller) {
          setOfflineStatus("checking", "内容已缓存 · 关闭后重新打开一次");
          if (interactive) showToast("内容已缓存；请关闭应用后重新打开，再做飞行模式测试");
          return true;
        }

        refreshOfflineStatus();
        if (interactive) {
          showToast(
            persistentStorage
              ? "离线自检通过 · 持久存储已启用 · v" + APP_VERSION
              : "离线自检通过 · 已缓存至本机 · v" + APP_VERSION
          );
        }
        return true;
      } catch (error) {
        offlineReady = false;
        setOfflineStatus("warning", error?.message || "离线缓存尚未就绪");
        if (interactive) showToast("离线自检未通过：" + (error?.message || "请联网后重试"));
        return false;
      } finally {
        if (button) button.disabled = false;
      }
    }

    async function initializeOffline() {
      if (!window.isSecureContext || !("serviceWorker" in navigator)) {
        setOfflineStatus("warning", "请从 HTTPS 地址添加到主屏幕");
        return;
      }
      try {
        const registration = await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
        if (navigator.onLine) registration.update().catch(() => {});
        await checkOfflineReadiness();
      } catch (error) {
        setOfflineStatus("warning", "离线缓存未启用，请联网后重试");
        console.warn("离线缓存未启用：", error);
      }
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function icon(name) {
      return ICONS[name] || ICONS["question-mark"];
    }

    function questionById(id) {
      return questions.find((question) => question.id === id);
    }

    function optionById(question, id, collection = "options") {
      return question?.[collection]?.find((option) => option.id === id);
    }

    function answerArray(id) {
      return Array.isArray(state.answers[id]) ? state.answers[id] : [];
    }

    function optionIsSelected(question, option, collection = "options") {
      if (question.type === "single" || collection === "behaviors") {
        const answer = collection === "behaviors" ? state.answers.memoryBehavior : state.answers[question.id];
        return answer === option.id;
      }
      const answer = question.type === "memory" ? answerArray("memoryItems") : answerArray(question.id);
      return answer.includes(option.id);
    }

    function renderOption(question, option, index, collection = "options") {
      const selected = optionIsSelected(question, option, collection);
      const rank = question.type === "rank" ? answerArray(question.id).indexOf(option.id) + 1 : 0;
      const mark = question.type === "rank"
        ? `<span class="rank-number" aria-hidden="true">${rank || "·"}</span>`
        : `<span class="option-mark" aria-hidden="true">${selected ? "✓" : ""}</span>`;
      return `
        <button class="option${option.sensitive ? " sensitive" : ""}" type="button"
          data-option="${escapeHTML(option.id)}" data-question="${escapeHTML(question.id)}"
          data-collection="${escapeHTML(collection)}" aria-pressed="${selected}">
          <img class="option-icon" src="${icon(option.icon)}" alt="">
          <span class="option-copy">
            <span class="option-title">${escapeHTML(option.title)}</span>
            <span class="option-desc">${escapeHTML(option.desc)}</span>
          </span>
          ${mark}
        </button>`;
    }

    function renderRankSummary(question) {
      if (question.type !== "rank") return "";
      const values = answerArray(question.id);
      const chips = [0, 1].map((position) => {
        const selected = optionById(question, values[position]);
        return selected
          ? `<span class="rank-chip">${position + 1}. ${escapeHTML(selected.title)}</span>`
          : `<span class="rank-chip empty">${position + 1}. 待选择</span>`;
      });
      return `<div class="rank-summary" aria-label="当前排序">${chips.join("")}</div>`;
    }

    function renderSafety(question) {
      if (!question.safety) return "";
      return `<div class="safety-note"><img src="${icon("shield-check")}" alt=""><span>${escapeHTML(question.safety)}</span></div>`;
    }

    function renderNote(question) {
      const label = question.noteLabel || "补充说明（可选）";
      return `
        <div class="note-field">
          <label for="note-${escapeHTML(question.id)}">${escapeHTML(label)}</label>
          <textarea id="note-${escapeHTML(question.id)}" data-note="${escapeHTML(question.id)}" maxlength="240"
            placeholder="可写一句具体例子，不必展开">${escapeHTML(state.notes[question.id] || "")}</textarea>
        </div>`;
    }

    function renderFacilitator(question) {
      const detail = question.facilitator;
      if (!detail) return "";
      return `
        <details class="facilitator-panel" open>
          <summary>主持人内部提示</summary>
          <div class="facilitator-grid">
            <div class="facilitator-item"><strong>真正验证</strong><span>${escapeHTML(detail.validates)}</span></div>
            <div class="facilitator-item"><strong>复杂度上升</strong><span>${escapeHTML(detail.complexity)}</span></div>
            <div class="facilitator-item"><strong>建议追问</strong><span>${escapeHTML(detail.followup)}</span></div>
            <div class="facilitator-item"><strong>不能这样解读</strong><span>${escapeHTML(detail.misread)}</span></div>
            <div class="facilitator-item"><strong>对 V0 的可能影响</strong><span>${escapeHTML(detail.v0)}</span></div>
          </div>
        </details>`;
    }

    function renderStandardQuestion(question, index) {
      const prefix = question.prefix === "timeline"
        ? `<div class="phase-strip" aria-label="会议过程"><span>会前</span><span>会中</span><span>会后</span><span>跟踪</span></div>`
        : "";
      return `
        ${prefix}
        ${renderRankSummary(question)}
        <div class="option-grid${question.type === "multi" && question.options.length > 7 ? "" : ""}">
          ${question.options.map((option, optionIndex) => renderOption(question, option, optionIndex)).join("")}
        </div>
        ${renderSafety(question)}
        ${renderNote(question)}
        ${renderFacilitator(question)}`;
    }

    function renderMemory(question) {
      return `
        <div class="option-grid">
          ${question.options.map((option, index) => renderOption(question, option, index)).join("")}
        </div>
        <section class="memory-block" aria-labelledby="memory-behavior-title">
          <h3 id="memory-behavior-title">发现可能的偏好时，应该怎么办？</h3>
          <p>请选择一种处理方式。默认不会自动无限记录。</p>
          <div class="option-grid">
            ${question.behaviors.map((option, index) => renderOption(question, option, index, "behaviors")).join("")}
          </div>
        </section>
        ${renderSafety(question)}
        ${renderNote(question)}
        ${renderFacilitator(question)}`;
    }

    function scenarioAnswer() {
      const answer = state.answers.scenario;
      return answer && typeof answer === "object" ? answer : { primary: "", secondary: "" };
    }

    function renderScenario(question) {
      const answer = scenarioAnswer();
      const current = question.options[state.scenarioView] || question.options[0];
      const primary = optionById(question, answer.primary);
      const secondary = optionById(question, answer.secondary);
      const selectingSecondary = Boolean(answer.primary && !answer.secondary && answer.primary !== "none");
      const complete = Boolean(answer.primary && answer.secondary);
      const disabled = complete || (selectingSecondary && current.id === answer.primary);
      const chooseLabel = complete
        ? "优先级已完成"
        : disabled
          ? "已选为第一优先"
          : selectingSecondary
          ? (current.id === "none" ? "没有第二优先" : "选为第二优先")
          : (current.id === "none" ? "这些都不是" : "最值得先做");
      const visual = current.image
        ? `<img src="${current.image}" alt="${escapeHTML(current.short)}情境插画">`
        : `<div class="scenario-empty" aria-hidden="true">?</div>`;
      return `
        <div class="scenario-picks" aria-label="当前优先级">
          <span class="pick-chip${primary ? "" : " empty"}">第一优先：${primary ? escapeHTML(primary.short) : "待选择"}</span>
          <span class="pick-chip${secondary ? "" : " empty"}">第二优先：${secondary ? escapeHTML(secondary.short) : "待选择"}</span>
        </div>
        <section class="scenario-shell" aria-label="工作情境选择">
          <div class="scenario-tabs" role="tablist" aria-label="五个候选情境">
            ${question.options.map((option, index) => `
              <button class="scenario-tab" type="button" role="tab" data-scenario-tab="${index}"
                aria-selected="${index === state.scenarioView}"><span class="scenario-tab-full">${escapeHTML(option.short)}</span><span class="scenario-tab-short">${escapeHTML(option.tab || option.short)}</span></button>`).join("")}
          </div>
          <div class="scenario-visual">${visual}</div>
          <div class="scenario-content">
            <div class="scenario-body">
              <span class="scenario-step">${complete ? "优先级已记录" : selectingSecondary ? "正在选择第二优先" : "正在选择第一优先"}</span>
              <h3>${escapeHTML(current.title)}</h3>
              <p>${escapeHTML(current.desc)}</p>
              <ul class="scenario-details">${current.details.map((detail) => `<li>${escapeHTML(detail)}</li>`).join("")}</ul>
              ${answer.primary ? `<button class="restart-priority" type="button" data-scenario-reset>重新选择优先级</button>` : ""}
            </div>
            <div class="scenario-controls">
              <button class="scenario-arrow" type="button" data-scenario-move="-1" aria-label="上一个情境">←</button>
              <button class="scenario-choose" type="button" data-scenario-choose="${escapeHTML(current.id)}" ${disabled ? "disabled" : ""}>${chooseLabel}</button>
              <button class="scenario-arrow" type="button" data-scenario-move="1" aria-label="下一个情境">→</button>
            </div>
          </div>
        </section>
        ${renderNote(question)}
        ${renderFacilitator(question)}`;
    }

    function renderQuestion(preservePosition = false) {
      const previousY = window.scrollY;
      const active = document.activeElement;
      const focusSelector = active?.dataset?.option
        ? `[data-option="${active.dataset.option}"]`
        : active?.dataset?.scenarioTab !== undefined
          ? `[data-scenario-tab="${active.dataset.scenarioTab}"]`
          : "";
      const question = questions[state.screen];
      const content = question.type === "scenario"
        ? renderScenario(question)
        : question.type === "memory"
          ? renderMemory(question)
          : renderStandardQuestion(question, state.screen);
      const nextLabel = state.screen === questions.length - 1 ? "查看需求摘要" : "下一题";
      const main = document.getElementById("main");
      main.innerHTML = `
        <article class="question-card" aria-labelledby="questionTitle">
          <header class="question-head">
            <span class="question-number">情境卡 ${state.screen + 1}</span>
            <h2 id="questionTitle" tabindex="-1">${escapeHTML(question.title)}</h2>
            <p class="question-help">${escapeHTML(question.help)}</p>
          </header>
          ${content}
          <p class="validation" id="validation" role="alert">${escapeHTML(validationMessage)}</p>
        </article>
        <nav class="action-bar" aria-label="问卷翻页">
          <div class="action-row">
            <button class="secondary-button" type="button" data-back ${state.screen === 0 ? "disabled" : ""}>上一题</button>
            <button class="primary-button" type="button" data-next>${nextLabel}</button>
          </div>
        </nav>`;
      updateProgress();
      window.scrollTo({ top: preservePosition ? previousY : 0, behavior: "auto" });
      requestAnimationFrame(() => {
        if (preservePosition && focusSelector) document.querySelector(focusSelector)?.focus({ preventScroll: true });
        else if (!preservePosition) document.getElementById("questionTitle")?.focus({ preventScroll: true });
      });
    }

    function updateProgress() {
      const isResult = state.screen >= questions.length;
      const completed = isResult ? questions.length : state.screen + 1;
      document.getElementById("progressFill").style.width = `${(completed / questions.length) * 100}%`;
      document.getElementById("progressText").textContent = isResult ? "已完成" : `${completed} / ${questions.length}`;
    }

    function validationFor(question) {
      const answer = state.answers[question.id];
      if (question.type === "single") return answer ? "" : "请先选择最符合实际的一项。";
      if (question.type === "scenario") {
        const scenario = scenarioAnswer();
        return scenario.primary && scenario.secondary ? "" : "请完成第一优先和第二优先的选择。";
      }
      if (question.type === "multi") return answerArray(question.id).length ? "" : "请至少选择一项。";
      if (question.type === "rank") {
        const values = answerArray(question.id);
        return values.includes(question.exclusive) || values.length === 2 ? "" : "请按顺序选择两项，或选择“暂时说不清”。";
      }
      if (question.type === "memory") {
        if (!answerArray("memoryItems").length) return "请先选择希望记住的内容。";
        if (!state.answers.memoryBehavior) return "请再选择发现偏好时的处理方式。";
      }
      return "";
    }

    function handleOption(question, optionId, collection) {
      validationMessage = "";
      if (collection === "behaviors") {
        state.answers.memoryBehavior = optionId;
      } else if (question.type === "single") {
        state.answers[question.id] = optionId;
      } else if (question.type === "multi") {
        let values = answerArray(question.id);
        if (optionId === question.exclusive) {
          values = values.length === 1 && values[0] === optionId ? [] : [optionId];
        } else {
          values = values.filter((value) => value !== question.exclusive);
          if (values.includes(optionId)) values = values.filter((value) => value !== optionId);
          else if (!question.max || values.length < question.max) values.push(optionId);
          else return showToast(`这道题最多选择 ${question.max} 项`);
        }
        state.answers[question.id] = values;
      } else if (question.type === "rank") {
        let values = answerArray(question.id);
        if (optionId === question.exclusive) {
          values = values.length === 1 && values[0] === optionId ? [] : [optionId];
        } else {
          values = values.filter((value) => value !== question.exclusive);
          if (values.includes(optionId)) values = values.filter((value) => value !== optionId);
          else if (values.length < question.max) values.push(optionId);
          else return showToast("已经选满两项；可先取消一项再调整");
        }
        state.answers[question.id] = values;
      } else if (question.type === "memory") {
        let values = answerArray("memoryItems");
        if (values.includes(optionId)) values = values.filter((value) => value !== optionId);
        else values.push(optionId);
        state.answers.memoryItems = values;
      }
      saveState();
      renderQuestion(true);
    }

    function chooseScenario(optionId) {
      const answer = scenarioAnswer();
      if (!answer.primary) {
        answer.primary = optionId;
        answer.secondary = optionId === "none" ? "none" : "";
      } else if (!answer.secondary && optionId !== answer.primary) {
        answer.secondary = optionId;
      }
      state.answers.scenario = answer;
      validationMessage = "";
      saveState();
      renderQuestion(true);
    }

    function moveScenario(delta) {
      const total = questions[2].options.length;
      state.scenarioView = (state.scenarioView + delta + total) % total;
      saveState();
      renderQuestion(true);
    }

    function goNext() {
      const question = questions[state.screen];
      validationMessage = validationFor(question);
      if (validationMessage) {
        renderQuestion(true);
        document.getElementById("validation")?.scrollIntoView({ block: "center", behavior: "smooth" });
        return;
      }
      state.screen = Math.min(questions.length, state.screen + 1);
      validationMessage = "";
      saveState();
      render();
    }

    function goBack() {
      if (state.screen <= 0) return;
      state.screen -= 1;
      validationMessage = "";
      saveState();
      render();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function labelFor(questionId, optionId, collection = "options") {
      if (!optionId) return "未选择";
      const question = questionById(questionId);
      const option = optionById(question, optionId, collection);
      return option?.short || option?.title || optionId;
    }

    function labelsFor(questionId, values, collection = "options") {
      const items = Array.isArray(values) ? values : [];
      return items.length ? items.map((value) => labelFor(questionId, value, collection)).join("、") : "未选择";
    }

    function resultModel() {
      const scenario = scenarioAnswer();
      const outputs = answerArray("outputs");
      const success = answerArray("success");
      const memoryItems = answerArray("memoryItems");
      return {
        primary: labelFor("scenario", scenario.primary),
        secondary: scenario.secondary === "none" ? "没有明确的第二优先" : labelFor("scenario", scenario.secondary),
        aiUse: labelFor("aiUse", state.answers.aiUse),
        friction: labelFor("friction", state.answers.friction),
        meeting: labelFor("meetingStep", state.answers.meetingStep),
        data: labelsFor("dataQuestions", answerArray("dataQuestions")),
        outputs: labelsFor("outputs", outputs),
        outputPrimary: labelFor("outputs", outputs[0]),
        outputSecondary: labelFor("outputs", outputs[1]),
        collaboration: labelFor("collaboration", state.answers.collaboration),
        info: labelsFor("infoScope", answerArray("infoScope")),
        memory: labelsFor("memory", memoryItems),
        memoryBehavior: labelFor("memory", state.answers.memoryBehavior, "behaviors"),
        success: labelsFor("success", success),
        successPrimary: labelFor("success", success[0]),
        successSecondary: labelFor("success", success[1])
      };
    }

    function getFollowups() {
      const scenario = scenarioAnswer();
      const collaboration = state.answers.collaboration;
      const info = answerArray("infoScope");
      const outputs = answerArray("outputs");
      const followups = [];
      const add = (text) => { if (text && !followups.includes(text)) followups.push(text); };

      const byScenario = {
        meeting: "请提供最近一场类似会议的原始资料、人工成品和会后跟进样本。",
        data: "请列出最常询问的 5 个经营指标，并确认口径、来源和数据责任人。",
        knowledge: "请提供一个最近需要查找历史资料的真实项目，并标出正确出处。",
        output: "请提供一份最近被老板修改过的报告或 PPT，区分内容、结构和排版问题。",
        assistant: "请各举一个希望 AI 记住和绝不能记住的真实工作例子。",
        none: "这些情境都不准确：最近一次最希望有人代为处理的真实工作是什么？"
      };
      add(byScenario[scenario.primary]);

      if (["assistantPrepare", "assistantReview"].includes(collaboration)) {
        add("请确认首期由哪位助理参与，以及谁准备资料、谁审核、谁最终确认。 ");
      } else if (collaboration === "team") {
        add("请明确首期参与的一个部门或项目，以及不同角色分别可以查看哪些资料。 ");
      } else if (collaboration === "unclear") {
        add("请用一个真实任务走一遍流程，确认实际由谁输入、使用和审核。 ");
      }

      if (info.some((id) => ["internalData", "people", "personal"].includes(id))) {
        add("请明确敏感资料的授权人、指定处理环境、保留时间和删除方式。 ");
      } else if (info.includes("testOnly")) {
        add("请确定一组虚构或脱敏样本，以及通过样本验证后是否进入下一阶段。 ");
      }

      if (outputs[0] && outputs[0] !== "unclear") {
        const sampleByOutput = {
          brief: "请提供一份老板认可的一页简报，标出必备字段和可省略内容。",
          answer: "请写下 3 个必须能继续追问的问题，并说明什么答案算有依据。",
          report: "请提供一份最近正式使用的报告，确认模板和人工修改量。",
          ppt: "请提供一份最近修改过的 PPT，确认企业模板和最终交付标准。",
          chart: "请确认首批图表的指标、时间范围、口径和正确示例。",
          creative: "请提供一份通过审核的宣传物料，并确认品牌和审批规则。",
          tasks: "请提供一份真实待办清单，确认负责人、时间和状态由谁维护。"
        };
        add(sampleByOutput[outputs[0]]);
      }

      const friction = state.answers.friction;
      if (followups.length < 3 && friction && friction !== "none") {
        add("请记录该问题最近一次发生时的耗时、等待和返工，作为验证前的基线。 ");
      }
      if (followups.length < 3) add("请确认第一阶段的观察周期、失败条件和停止投入条件。 ");

      return followups.map((item) => item.trim()).slice(0, 5);
    }

    function hypothesisText() {
      const scenario = scenarioAnswer();
      const collaboration = state.answers.collaboration;
      const outputs = answerArray("outputs");
      if (scenario.primary === "none" || collaboration === "unclear" || outputs.includes("unclear")) {
        return "信息不足 — 应回到最近一次真实任务补齐样本，再判断是否值得进入 V0。";
      }
      const narrowWorkflow = ["meeting", "knowledge"].includes(scenario.primary)
        && ["assistantPrepare", "assistantReview"].includes(collaboration)
        && outputs.some((value) => ["brief", "tasks", "answer"].includes(value));
      if (narrowWorkflow) {
        return "部分匹配 — 与“助理协作、老板确认的一条窄流程”假设相近；仍需用真实样本验证频率、节省时间和准确性。";
      }
      return "出现不同方向 — 应优先验证老板选择的真实场景，不把团队当前偏好自动写进产品范围。";
    }

    function normalizedAnswers() {
      const scenario = scenarioAnswer();
      const normalizeOne = (questionId, value, collection = "options") => ({
        id: value || null,
        label: value ? labelFor(questionId, value, collection) : null
      });
      const normalizeMany = (questionId, values) => (values || []).map((value) => normalizeOne(questionId, value));
      return {
        aiUse: { ...normalizeOne("aiUse", state.answers.aiUse), note: state.notes.aiUse || "" },
        friction: { ...normalizeOne("friction", state.answers.friction), note: state.notes.friction || "" },
        scenario: {
          primary: normalizeOne("scenario", scenario.primary),
          secondary: normalizeOne("scenario", scenario.secondary),
          note: state.notes.scenario || ""
        },
        meetingStep: { ...normalizeOne("meetingStep", state.answers.meetingStep), note: state.notes.meetingStep || "" },
        dataQuestions: { selections: normalizeMany("dataQuestions", answerArray("dataQuestions")), note: state.notes.dataQuestions || "" },
        outputs: { ranking: normalizeMany("outputs", answerArray("outputs")), note: state.notes.outputs || "" },
        collaboration: { ...normalizeOne("collaboration", state.answers.collaboration), note: state.notes.collaboration || "" },
        infoScope: { selections: normalizeMany("infoScope", answerArray("infoScope")), note: state.notes.infoScope || "" },
        memory: {
          selections: normalizeMany("memory", answerArray("memoryItems")),
          behavior: normalizeOne("memory", state.answers.memoryBehavior, "behaviors"),
          note: state.notes.memory || ""
        },
        success: { ranking: normalizeMany("success", answerArray("success")), note: state.notes.success || "" }
      };
    }

    async function downloadText(filename, content, mime) {
      const blob = new Blob([content], { type: `${mime};charset=utf-8` });
      const file = new File([blob], filename, { type: `${mime};charset=utf-8` });

      if (navigator.share && navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: filename.replace(/\.[^.]+$/, "")
          });
          showToast("已打开分享菜单，可存入“文件”");
          return;
        } catch (error) {
          if (error?.name === "AbortError") {
            showToast("已取消导出");
            return;
          }
        }
      }

      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("文件已导出");
    }

    async function copyResult() {
      const text = resultMarkdown();
      try {
        if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
        else throw new Error("clipboard unavailable");
        showToast("摘要已复制");
      } catch (_error) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        showToast(copied ? "摘要已复制" : "复制受限，请使用 Markdown 导出");
      }
    }

    function printWithMode(mode) {
      document.body.dataset.print = mode;
      window.print();
    }

    function buildPrintSheet() {
      const printSheet = document.getElementById("printSheet");
      const sections = questions.map((question, index) => {
        const instruction = question.type === "rank"
          ? "按顺序选择前两项"
          : question.type === "multi"
            ? (question.max ? `最多选择 ${question.max} 项` : "可多选")
            : question.type === "scenario"
              ? "选择第一优先和第二优先"
              : question.type === "memory"
                ? "可多选，并在下方选择偏好处理方式"
                : "单选";
        const options = question.options.map((option) => `
          <div class="paper-option"><span class="paper-box"></span><span>${escapeHTML(option.short || option.title)}</span></div>`).join("");
        const behaviorOptions = question.type === "memory"
          ? `<p class="paper-instruction">发现偏好时：</p><div class="paper-options">${question.behaviors.map((option) => `
              <div class="paper-option"><span class="paper-box"></span><span>${escapeHTML(option.title)}</span></div>`).join("")}</div>`
          : "";
        return `
          <section class="paper-question">
            <h2>${index + 1}. ${escapeHTML(question.title)}</h2>
            <p class="paper-instruction">${instruction}</p>
            <div class="paper-options">${options}</div>
            ${behaviorOptions}
            <div class="paper-note" aria-label="补充说明"></div>
          </section>`;
      }).join("");
      printSheet.innerHTML = `
        <header class="paper-head">
          <h1>AI需求情景卡</h1>
          <p>预计 5—10 分钟 · 请以最近发生的真实工作为准</p>
          <p>姓名（可选）：________________　日期：________________</p>
        </header>
        ${sections}
        <footer class="paper-footer">纸面选择用于会谈讨论，不等于最终需求结论；敏感资料勾选不等于授权接入。</footer>`;
    }

    function render() {
      if (state.screen >= questions.length) renderResult();
      else renderQuestion();
    }

    document.addEventListener("click", (event) => {
      const optionButton = event.target.closest("[data-option]");
      if (optionButton) {
        const question = questionById(optionButton.dataset.question);
        if (question) handleOption(question, optionButton.dataset.option, optionButton.dataset.collection);
        return;
      }

      const scenarioTab = event.target.closest("[data-scenario-tab]");
      if (scenarioTab) {
        state.scenarioView = Number(scenarioTab.dataset.scenarioTab) || 0;
        saveState();
        renderQuestion(true);
        return;
      }

      const scenarioMove = event.target.closest("[data-scenario-move]");
      if (scenarioMove) return moveScenario(Number(scenarioMove.dataset.scenarioMove));

      const scenarioChoose = event.target.closest("[data-scenario-choose]");
      if (scenarioChoose) return chooseScenario(scenarioChoose.dataset.scenarioChoose);

      if (event.target.closest("[data-scenario-reset]")) {
        state.answers.scenario = { primary: "", secondary: "" };
        validationMessage = "";
        saveState();
        renderQuestion(true);
        return;
      }

      if (event.target.closest("[data-next]")) return goNext();
      if (event.target.closest("[data-back]")) return goBack();
      if (event.target.closest("[data-result-back]")) {
        state.screen = questions.length - 1;
        saveState();
        render();
        return;
      }

      const exportButton = event.target.closest("[data-export]");
      if (exportButton) {
        const type = exportButton.dataset.export;
        if (type === "copy") copyResult();
        if (type === "markdown") downloadText("AI需求情景卡-会谈摘要.md", resultMarkdown(), "text/markdown");
        if (type === "json") downloadText("AI需求情景卡-会谈答案.json", resultJSON(), "application/json");
        if (type === "print") printWithMode("result");
      }
    });

    document.addEventListener("input", (event) => {
      const field = event.target.closest("[data-note]");
      if (!field) return;
      state.notes[field.dataset.note] = field.value;
      saveState();
    });

    document.addEventListener("keydown", (event) => {
      if (state.screen >= questions.length) return;
      const tag = event.target.tagName;
      if (["TEXTAREA", "INPUT", "BUTTON", "A"].includes(tag)) return;
      const question = questions[state.screen];
      if (/^[1-9]$/.test(event.key)) {
        const selector = question.type === "scenario" ? "[data-scenario-tab]" : "[data-option]";
        const target = document.querySelectorAll(selector)[Number(event.key) - 1];
        if (target) { event.preventDefault(); target.click(); }
      } else if (question.type === "scenario" && event.key === "ArrowLeft") {
        event.preventDefault(); moveScenario(-1);
      } else if (question.type === "scenario" && event.key === "ArrowRight") {
        event.preventDefault(); moveScenario(1);
      } else if (event.key === "Enter") {
        event.preventDefault(); goNext();
      }
    });

    document.getElementById("printBlankButton").addEventListener("click", () => printWithMode("blank"));
    document.getElementById("offlineCheckButton").addEventListener("click", () => {
      checkOfflineReadiness({ interactive: true });
    });
    document.getElementById("resetButton").addEventListener("click", () => {
      if (!window.confirm("确定清空当前浏览器里的全部答案并重新开始吗？")) return;
      state = blankState();
      validationMessage = "";
      localStorage.removeItem(STORAGE_KEY);
      render();
      showToast("已清空，可以重新回答");
    });

    window.addEventListener("afterprint", () => { delete document.body.dataset.print; });
    window.addEventListener("online", refreshOfflineStatus);
    window.addEventListener("offline", refreshOfflineStatus);
    buildPrintSheet();
    render();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        checkOfflineReadiness().catch(() => {});
      });
    }
    window.addEventListener("load", initializeOffline);
  </script>
</body>
</html>
